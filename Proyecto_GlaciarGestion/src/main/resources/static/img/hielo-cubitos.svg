<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Hielo en cubitos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f9ff"/>
      <stop offset="100%" stop-color="#deebfb"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#cfe3f8" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7fa6cc" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(90 110)">
    <rect x="30" y="260" width="260" height="240" rx="30" fill="url(#ice)" stroke="#b7d2ee"/>
    <rect x="260" y="160" width="260" height="240" rx="30" fill="url(#ice)" stroke="#b7d2ee" transform="rotate(12 390 280)"/>
    <rect x="510" y="250" width="260" height="240" rx="30" fill="url(#ice)" stroke="#b7d2ee" transform="rotate(-8 640 370)"/>
    <rect x="760" y="160" width="260" height="240" rx="30" fill="url(#ice)" stroke="#b7d2ee" transform="rotate(10 890 280)"/>
    <rect x="140" y="40" width="260" height="240" rx="30" fill="url(#ice)" stroke="#b7d2ee" transform="rotate(-10 270 160)"/>
    <rect x="430" y="20" width="260" height="240" rx="30" fill="url(#ice)" stroke="#b7d2ee" transform="rotate(8 560 140)"/>
  </g>
</svg>
