<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta – Glaciar Gestión</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
    <div class="brand" aria-hidden="true">✶ <span class="brand-name">Glaciar Gestion</span></div>
</header>

<main class="layout">
    <section class="auth-card wide" aria-labelledby="titulo-registro">
        <h1 id="titulo-registro" class="auth-title">Crear cuenta</h1>
        <p class="auth-subtitle">Completa los datos para registrarte</p>

        <p class="alert alert-danger" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/registro}" th:object="${registroRequest}" method="post" novalidate>
            <div class="form-grid">
                <div class="field">
                    <label for="nombre">Nombre completo</label>
                    <div class="input-wrap">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2-8 4.5V21h16v-2.5C20 16 16.4 14 12 14z"></path>
                            </svg>
                        </span>
                        <input id="nombre" type="text" th:field="*{nombre}" placeholder="Ej. Juan Perez" autocomplete="name" required>
                    </div>
                    <small class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                </div>

                <div class="field">
                    <label for="telefono">Telefono</label>
                    <div class="input-wrap">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24 11.2 11.2 0 0 0 3.5.56 1 1 0 0 1 1 1V21a1 1 0 0 1-1 1A17 17 0 0 1 2 5a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.2 11.2 0 0 0 .56 3.5 1 1 0 0 1-.24 1z"></path>
                            </svg>
                        </span>
                        <input id="telefono" type="text" th:field="*{telefono}" placeholder="+506 8888-0000" autocomplete="tel" required>
                    </div>
                    <small class="field-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></small>
                </div>

                <div class="field">
                    <label for="correo">Correo electronico</label>
                    <div class="input-wrap">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5L4 8V6l8 5 8-5v2z"></path>
                            </svg>
                        </span>
                        <input id="correo" type="email" th:field="*{correo}" placeholder="correo@ejemplo.com" autocomplete="email" required>
                    </div>
                    <small class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></small>
                </div>

                <div class="field">
                    <label for="contrasena">Contrasena</label>
                    <div class="input-wrap">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M17 8h-1V6a4 4 0 1 0-8 0v2H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-7-2a2 2 0 1 1 4 0v2h-4V6zm2 10a2 2 0 0 1-1-3.73V11h2v1.27A2 2 0 0 1 12 16z"></path>
                            </svg>
                        </span>
                        <input id="contrasena" type="password" th:field="*{contrasena}" placeholder="Minimo 8 caracteres" autocomplete="new-password" required>
                    </div>
                    <small class="field-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></small>
                </div>
            </div>

            <div class="actions">
                <button type="submit" class="btn">Crear cuenta</button>
            </div>
        </form>

        <p class="link-row">
            <a th:href="@{/login}">Ya tienes cuenta? Inicia sesion</a>
        </p>
    </section>
</main>
</body>
</html>
