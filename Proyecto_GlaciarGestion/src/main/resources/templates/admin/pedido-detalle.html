<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de pedido - Administrador</title>
</head>
<body>
<h1>Detalle del pedido</h1>

<p>Usuario: <strong data-th-text="${usuario.nombre}"></strong></p>

<p>
    <a data-th-href="@{/admin/pedidos}">Volver a pedidos</a>
</p>

<p data-th-if="${error}" data-th-text="${error}" style="color:red"></p>

<section>
    <p>ID pedido: <strong data-th-text="${pedido.id}"></strong></p>
    <p>Cliente: <strong data-th-text="${pedido.usuario.nombre}"></strong></p>
    <p>Fecha: <strong data-th-text="${pedido.fecha}"></strong></p>
    <p>Total: <strong data-th-text="${pedido.total}"></strong></p>
    <p>Estado actual: <strong data-th-text="${pedido.estado}"></strong></p>
</section>

<h2>Actualizar estado</h2>
<form data-th-action="@{'/admin/pedidos/' + ${pedido.id} + '/estado'}" method="post">
    <label>Nuevo estado:</label>
    <select name="estado" required>
        <option data-th-each="estadoItem : ${estados}"
                data-th-value="${estadoItem}"
                data-th-text="${estadoItem}"
                data-th-selected="${estadoItem == pedido.estado}">
        </option>
    </select>
    <button type="submit">Guardar estado</button>
</form>

<h2>Productos del pedido</h2>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Producto</th>
        <th>Presentacion</th>
        <th>Cantidad</th>
        <th>Precio unitario</th>
        <th>Subtotal</th>
    </tr>
    </thead>

    <tbody>
    <tr data-th-each="detalle : ${detalles}">
        <td data-th-text="${detalle.producto.nombre}"></td>
        <td data-th-text="${detalle.producto.presentacion}"></td>
        <td data-th-text="${detalle.cantidad}"></td>
        <td data-th-text="${detalle.precioUnitario}"></td>
        <td data-th-text="${detalle.precioUnitario * detalle.cantidad}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
