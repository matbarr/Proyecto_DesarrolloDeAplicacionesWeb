<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Pedido – Admin | Glaciar Gestión</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="nav-brand" th:href="@{/admin/productos}">
            <span class="snowflake">❄</span> Glaciar Gestión
        </a>
        <div class="nav-links">
            <a th:href="@{/admin/productos}">Productos</a>
            <a th:href="@{/admin/pedidos}" class="active">Pedidos</a>
        </div>
        <div class="nav-right">
            <span class="nav-user" th:text="'Hola, ' + ${usuario.nombre}"></span>
            <form th:action="@{/logout}" method="post" class="form-inline">
                <button type="submit" class="btn-logout">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="page">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title" th:text="'Pedido #' + ${pedido.id}"></h1>
            <a th:href="@{/admin/pedidos}" class="btn-sm btn-outline">← Volver a pedidos</a>
        </div>

        <div class="page-alert danger" th:if="${error}" th:text="${error}"></div>

        <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start">
            <div class="card">
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Cliente</span>
                        <span class="info-value" th:text="${pedido.usuario.nombre}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Fecha</span>
                        <span class="info-value" th:text="${pedido.fecha}"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Total</span>
                        <span class="info-value" th:text="|₡${pedido.total}|"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Estado</span>
                        <span th:class="|badge badge-${pedido.estado}|"
                              th:text="${pedido.estado}"></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <p class="card-title">Actualizar estado</p>
                    <form th:action="@{/admin/pedidos/{id}/estado(id=${pedido.id})}" method="post">
                        <div class="form-group">
                            <label for="estado">Nuevo estado</label>
                            <select id="estado" name="estado" required>
                                <option th:each="estadoItem : ${estados}"
                                        th:value="${estadoItem}"
                                        th:text="${estadoItem}"
                                        th:selected="${estadoItem == pedido.estado}"></option>
                            </select>
                        </div>
                        <button type="submit" class="btn-action btn-teal" style="width:100%">Guardar</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top:20px">
            <div class="card-body" style="padding-bottom:0">
                <p class="card-title">Productos del pedido</p>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Presentación</th>
                            <th>Cantidad</th>
                            <th>Precio unitario</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalle : ${detalles}">
                            <td th:text="${detalle.producto.nombre}"></td>
                            <td th:text="${detalle.producto.presentacion}"></td>
                            <td th:text="${detalle.cantidad}"></td>
                            <td th:text="|₡${detalle.precioUnitario}|"></td>
                            <td th:text="|₡${detalle.precioUnitario * detalle.cantidad}|"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="total-row">
                <span class="total-label">Total del pedido</span>
                <span class="total-value" th:text="|₡${pedido.total}|"></span>
            </div>
        </div>
    </div>
</div>
</body>
</html>
