<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo – Glaciar Gestión</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="nav-brand" th:href="@{/cliente/productos}">
            <span class="snowflake">❄</span> Glaciar Gestión
        </a>
        <div class="nav-links">
            <a th:href="@{/cliente/productos}" class="active">Catálogo</a>
            <a th:href="@{/cliente/carrito}">Carrito</a>
            <a th:href="@{/cliente/pedidos}">Mis Pedidos</a>
        </div>
        <div class="nav-right">
            <span class="nav-user" th:text="'Hola, ' + ${usuario.nombre}"></span>
            <form th:action="@{/logout}" method="post" class="form-inline">
                <button type="submit" class="btn-logout">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="page">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Catálogo de Productos</h1>
        </div>

        <div class="page-alert danger" th:if="${error}" th:text="${error}"></div>

        <div class="products-grid">
            <div class="product-card" th:each="producto : ${productos}">
                <div class="product-card-body">
                    <div class="product-card-name" th:text="${producto.nombre}"></div>
                    <div class="product-card-pres" th:text="${producto.presentacion}"></div>
                    <div class="product-card-price" th:text="|₡${producto.precio}|"></div>
                    <div class="product-card-stock" th:text="'Stock: ' + ${producto.cantidad}"></div>
                </div>
                <div class="product-card-footer">
                    <a class="btn-sm btn-outline" th:href="@{/cliente/productos/{id}(id=${producto.id})}">Ver detalle</a>
                    <form th:action="@{/cliente/carrito/agregar}" method="post" class="form-inline" style="flex:1;display:flex;gap:6px;align-items:center">
                        <input type="hidden" name="productoId" th:value="${producto.id}">
                        <input type="number" name="cantidad" min="1" value="1" required
                               style="width:52px;padding:5px 6px;border:1.5px solid #c8d9eb;border-radius:6px;font-size:13px;text-align:center;font-family:inherit">
                        <button type="submit" class="btn-sm btn-primary">+ Carrito</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
