<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pedidos – Glaciar Gestión</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar">
    <div class="container">
        <a class="nav-brand" th:href="@{/cliente/inicio}">
            <span class="snowflake">❄</span> Glaciar Gestión
        </a>
        <div class="nav-links">
            <a th:href="@{/cliente/inicio}">Inicio</a>
            <a th:href="@{/cliente/productos}">Catálogo</a>
            <a th:href="@{/cliente/carrito}">Carrito</a>
            <a th:href="@{/cliente/pedidos}" class="active">Mis Pedidos</a>
        </div>
        <div class="nav-right">
            <span class="nav-user" th:text="'Hola, ' + ${usuario.nombre}"></span>
            <form th:action="@{/logout}" method="post" class="form-inline">
                <button type="submit" class="btn-logout">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="page">
    <div class="container">
        <div class="page-header">
            <h1 class="page-title">Mis Pedidos</h1>
        </div>

        <div class="page-alert danger" th:if="${error}" th:text="${error}"></div>

        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.id}"></td>
                            <td th:text="${pedido.fecha}"></td>
                            <td th:text="|₡${pedido.total}|"></td>
                            <td>
                                <span th:class="|badge badge-${pedido.estado}|"
                                      th:text="${pedido.estado}"></span>
                            </td>
                            <td>
                                <div class="action-group">
                                    <a class="btn-sm btn-outline"
                                       th:href="@{/cliente/pedidos/{id}/detalle(id=${pedido.id})}">Ver detalle</a>
                                    <a class="btn-sm btn-primary"
                                       th:href="@{/cliente/pedidos/{id}/estado(id=${pedido.id})}">Ver estado</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
